[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "vibe-translating"
version = "0.1.0"
description = "AI-powered translation platform with agent support"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "flask>=3.0",
    "flask-socketio>=5.3",
    "PyQt6>=6.6",
    "Pillow>=10.0",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
]

[project.scripts]
vibe-translate = "src.frontend.cli.app:main"
vibe-webui = "src.frontend.webui.app:main"
vibe-gui = "src.frontend.gui.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
